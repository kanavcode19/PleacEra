<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Register | PLACERA</title>

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700;800&display=swap"
          rel="stylesheet">

    <link rel="stylesheet" href="style.css">

</head>


<body>


    <!-- HEADER -->

    <header class="header">

        <a href="index.html"
           class="logo-box">

            <img src="logosdm.jpg"
                 alt="PLACERA Logo">

        </a>


        <h1 class="brand-title">
            PLACERA
        </h1>

    </header>



    <!-- THEME -->

    <div class="theme-container">

        <span class="theme-symbol">☀</span>

        <label class="theme-switch">

            <input type="checkbox"
                   class="themeToggle">

            <span class="slider"></span>

        </label>

        <span class="theme-symbol">☾</span>

    </div>



    <!-- REGISTER -->

    <main class="auth-page">


        <section class="auth-card">


            <div class="auth-heading">

                <span class="auth-badge">
                    PLACED
                </span>

                <h2>
                    Create Account
                </h2>

                <p>
                    Register to access placement opportunities
                </p>

            </div>



            <form>


                <div class="input-group">

                    <label>
                        Username
                    </label>

                    <input type="text"
                           placeholder="Enter username"
                           required>

                </div>



                <div class="input-group">

                    <label>
                        Email
                    </label>

                    <input type="email"
                           placeholder="Enter email"
                           required>

                </div>



                <div class="input-group">

                    <label>
                        Password
                    </label>

                    <input type="password"
                           placeholder="Enter password"
                           required>

                </div>



                <div class="input-group">

                    <label>
                        Confirm Password
                    </label>

                    <input type="password"
                           placeholder="Confirm password"
                           required>

                </div>



                <button type="submit"
                        class="auth-btn">

                    Register

                </button>


            </form>



            <p class="switch-text">

                Already have an account?

                <a href="login.html">
                    Login
                </a>

            </p>


        </section>

    </main>


    <script src="script.js"></script>

</body>

</html>
