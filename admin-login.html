<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Admin Login | PLACERA</title>

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@500;600;700;800&display=swap"
          rel="stylesheet">

    <link rel="stylesheet" href="style.css">

</head>


<body>


    <!-- HEADER -->

    <header class="header">

        <a href="index.html"
           class="logo-box">

            <img src="assets/logo.png"
                 alt="PLACERA Logo">

        </a>


        <h1 class="brand-title">
            PLACERA
        </h1>

    </header>



    <!-- THEME -->

    <div class="theme-container">

        <span class="theme-symbol">☀</span>

        <label class="theme-switch">

            <input type="checkbox"
                   class="themeToggle">

            <span class="slider"></span>

        </label>

        <span class="theme-symbol">☾</span>

    </div>



    <!-- ADMIN LOGIN -->

    <main class="auth-page">


        <section class="auth-card admin-card">


            <div class="auth-heading">

                <span class="admin-badge">
                    ADMIN
                </span>

                <h2>
                    Admin Login
                </h2>

                <p>
                    Manage and update placement information
                </p>

            </div>



            <form>


                <div class="input-group">

                    <label>
                        Username
                    </label>

                    <input type="text"
                           placeholder="Enter admin username"
                           required>

                </div>



                <div class="input-group">

                    <label>
                        Password
                    </label>

                    <input type="password"
                           placeholder="Enter admin password"
                           required>

                </div>



                <button type="submit"
                        class="auth-btn">

                    Login

                </button>


            </form>



            <a href="index.html"
               class="back-link">

                ← Back to Home

            </a>


        </section>

    </main>


    <script src="script.js"></script>

</body>

</html>
